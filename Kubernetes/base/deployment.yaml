apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: Kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: everyday-is-devops-day-frontend:sha-a123
          # 'IfNotPresent' utilizes cached local images if available,
          # but avoids ErrImageNeverPull if replicas land on different nodes.
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              # Equal memory request/limit lowers eviction risk within the
              # Burstable QoS class and guarantees dedicated memory reservation.
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
              # CPU limit omitted to prevent CFS throttling.
              # Note: Omitting CPU limit classifies this Pod as Burstable, not Guaranteed.

          # Startup probe allows up to 32s (2s initial + 10 * 3s) for cold boots
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
